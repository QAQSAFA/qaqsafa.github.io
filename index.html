<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cloudier Ace 的个人博客">
  <title>Cloudier Ace 的博客</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- 开场动画（名字在 assets/js/config.js 里改） -->
  <div class="intro-overlay" id="introOverlay">
    <div>
      <div class="intro-name" id="introName"></div>
      <div class="intro-sub">Cloudier Ace</div>
    </div>
  </div>

  <!-- 导航 -->
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html" id="navBrand">Cloudier Ace<span class="dot">.</span></a>
      <nav class="nav-links" id="navMenu">
        <a href="index.html" class="active">首页</a>
        <a href="posts.html">文章</a>
        <a href="projects.html">开源</a>
        <a href="https://github.com/QAQSAFA" target="_blank" rel="noopener">GitHub ↗</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">☰</button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero wrap">
    <div class="kicker reveal">Personal Blog</div>
    <h1 class="hero-title reveal" style="transition-delay:.05s">Cloudier<br>Ace<span class="accent">.</span></h1>
    <p class="hero-sub reveal" style="transition-delay:.1s">Designer &amp; Developer — 记录学习、折腾与生活。</p>
    <div class="hero-cta reveal" style="transition-delay:.15s">
      <a class="btn btn-primary" href="posts.html">阅读文章</a>
      <a class="btn btn-ghost" href="projects.html">开源项目</a>
    </div>
    <div class="hero-scroll">SCROLL</div>
  </section>

  <!-- 最新文章 -->
  <section class="section wrap">
    <div class="section-head">
      <h2 class="section-title reveal">最新<em>文章</em></h2>
      <a class="section-link reveal" href="posts.html">查看全部 →</a>
    </div>
    <div class="post-grid" id="latestPosts"></div>
  </section>

  <!-- 开源板块 -->
  <section class="section wrap">
    <div class="section-head">
      <h2 class="section-title reveal">开源<em>项目</em></h2>
      <a class="section-link reveal" href="projects.html">更多 →</a>
    </div>
    <div class="project-grid" id="latestProjects"></div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="f-brand" id="footName">Cloudier Ace</div>
      <div class="f-meta">© <span id="footYear">2026</span> Cloudier Ace · 由 GitHub Pages 驱动</div>
      <div class="social">
        <a href="https://github.com/QAQSAFA" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/posts.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    /* 首页：加载最新 3 篇文章 + 2 个开源项目（先显示示例/缓存，GitHub 有数据后自动刷新） */
    POSTS.load(function (posts) {
      var el = document.getElementById("latestPosts");
      if (el) POSTS.renderGrid(el, posts.slice(0, 3));
    }).then(function (posts) {
      var el = document.getElementById("latestPosts");
      if (el) POSTS.renderGrid(el, posts.slice(0, 3));
    });
    fetch("data/projects.json").then(function (r) { return r.json(); }).then(function (projects) {
      var box = document.getElementById("latestProjects");
      if (!projects || !projects.length) { box.innerHTML = '<p class="reveal in">暂无项目，稍后添加。</p>'; return; }
      box.innerHTML = projects.slice(0, 2).map(function (p) {
        return '<a class="project-card reveal" href="' + (p.githubUrl || "#") + '" target="_blank" rel="noopener">' +
          '<div class="p-name">' + (p.name || "") + ' <span class="star">★ ' + (p.stars || 0) + "</span></div>" +
          '<div class="p-desc">' + (p.description || "") + "</div>" +
          '<div class="p-tech">' + (p.techStack || []).map(function (t) { return '<span class="tag">' + t + "</span>"; }).join("") + "</div>" +
        "</a>";
      }).join("");
      box.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in"); });
    });
  </script>
</body>
</html>
